generator_ckpt: checkpoints/ode_init.pt
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_name: Wan2.1-T2V-14B
text_encoder_fsdp_wrap_strategy: size
denoising_step_list: [1000, 800, 600, 400, 200]
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 0
sharding_strategy: hybrid_full
lr: 1.5e-06
lr_critic: 4.0e-07
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
data_path: prompts/step_cache_r0_single.txt
batch_size: 1
ema_weight: 0.99
ema_start_step: 200
total_batch_size: 64
log_iters: 100
negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
dfake_gen_update_ratio: 5
image_or_video_shape: [1, 21, 16, 60, 104]
distribution_loss: dmd
trainer: score_distillation
gradient_checkpointing: true
num_frame_per_block: 3
load_raw_video: false
model_kwargs:
  timestep_shift: 5.0

# R0 only observes scalar stage/RNG metadata. No cache compression, output reuse,
# attention input rewrite, or scheduler change is enabled here.
flowcache:
  enabled: true
  debug: false
  metadata_enabled: false
  metadata_output_path: null
  r0_trace_enabled: true
  r0_trace_rng_state: true
  r0_trace_output_path: ${oc.env:FLOWCACHE_R0_TRACE_OUTPUT_PATH,outputs/step_cache_r0/r0_trace.jsonl}
  r0_stage_match_tolerance: 1.0e-4
  log_every_window: false
  log_kv_ranges: false
  log_summary: false

  output_reuse_enabled: false
  output_reuse_dry_run_enabled: false
  output_reuse_log_jsonl: false
  kv_compress_enabled: false
  kv_compress_dry_run: false
  kv_compress_real_enabled: false
  cache_body_compress_enabled: false
  cache_body_compress_real_enabled: false
  persistent_cache_compress_enabled: false
  persistent_cache_compress_real_enabled: false
  compacted_kv_enabled: false
  compacted_kv_real_enabled: false

  profiler_enabled: true
  profiler_mode: coarse
  profiler_output_path: ${oc.env:FLOWCACHE_R0_PROFILER_OUTPUT_PATH,outputs/step_cache_r0/r0_profile.jsonl}
  profiler_summary_path: ${oc.env:FLOWCACHE_R0_PROFILER_SUMMARY_PATH,outputs/step_cache_r0/r0_profile_summary.json}
  profiler_log_events: true
  profiler_cuda_synchronize: true
  profiler_fine_enabled: false
  profiler_record_clean_cache_update: true
  profiler_record_decode_save: true
